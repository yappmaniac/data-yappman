# Daily prices for the basket check page (/basket/): one small capped read of our own pilot dataset, then the page's data file is rebuilt.
# The read is ONE request a day: limit 340 rows, named fields only. The pilot run writes 315 rows at 05:45 UTC; this job runs at 06:40 UTC.
# It does nothing unless the repository variable BASKET_PILOT_SYNC_ENABLED is "true" and BASKET_PILOT_DATASET holds the dataset's
# id (Settings > Secrets and variables > Actions > Variables). If the dataset is private, a READ-ONLY token for that one dataset goes in the
# repository secret APIFY_BASKET_READ_TOKEN (created by Russell; never typed into a command or printed). Setting the variable to anything
# else stops the job. docs/release/build-basket-pilot.js refuses a bad read and never replaces newer data with older: a failure here
# leaves the current file in place, and the page then shows its own "prices may be out of date" notice.
name: basket-pilot-sync
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"
permissions:
  contents: write
  pages: write
concurrency:
  group: basket-pilot-sync
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.BASKET_PILOT_SYNC_ENABLED == 'true' && vars.BASKET_PILOT_DATASET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - name: Read the newest rows (one request, capped)
        env:
          DATASET: ${{ vars.BASKET_PILOT_DATASET }}
          APIFY_BASKET_READ_TOKEN: ${{ secrets.APIFY_BASKET_READ_TOKEN }}
        run: |
          if ! [[ "$DATASET" =~ ^[A-Za-z0-9_.~-]{6,64}$ ]]; then echo "unexpected dataset id"; exit 1; fi
          FIELDS="retailerProductId,retailer,name,price,loyaltyPrice,wasPrice,promotionText,inStock,scrapedAt"
          AUTH=()
          if [ -n "$APIFY_BASKET_READ_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $APIFY_BASKET_READ_TOKEN"); fi
          curl -fsS --max-time 60 --max-filesize 400000 -H "Accept: application/json" "${AUTH[@]}" \
            "https://api.apify.com/v2/datasets/${DATASET}/items?format=json&clean=true&desc=true&limit=340&fields=${FIELDS}" -o rows.json
      - name: Rebuild the data file (a failure stops here and leaves the current file in place)
        run: |
          node docs/release/build-basket-pilot.js --run rows.json
          node docs/release/build-basket-pilot.js --check
      - name: Commit it if it changed
        id: commit
        run: |
          if git diff --quiet -- data/basket-pilot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/basket-pilot.json
          git commit -m "Update the basket pilot prices"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ask GitHub Pages to build (pushes made with the workflow token may not start a build by themselves)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
